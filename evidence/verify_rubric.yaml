rubrics:
  - id: 1
    type: f2p
    text: "候选策略在发布前完成语法、引用和签名机制校验。"
  - id: 2
    type: f2p
    text: "每次镜像评估从同一确认策略读取，不会跨两个配置代际。"
  - id: 3
    type: f2p
    text: "写盘、解析或进程中止失败时最后有效策略继续服务，未完成候选可清理。"
  - id: 4
    type: f2p
    text: "并发更新只允许最新成功策略成为当前版本，旧更新不能回退。"
  - id: 5
    type: f2p
    text: "重启恢复最后有效策略并拒绝半写配置。"
  - id: 6
    type: f2p
    text: "配置错误与签名拒绝产生可区分且稳定的结果。"
  - id: 7
    type: p2p
    text: "Docker、OCI、SIF、多引用匹配和未配置策略默认行为保持兼容。"
  - id: 8
    type: p2p
    text: "普通策略评估和缓存命中不发生回归。"
